[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pbg"
version = "1.0.0"
description = "Prefix-Conditioned Boltzmann Generators in JAX"
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
# Versions of the paper environment. RDKit fixes the canonical atom traversal
# of PBG-Joint (``atom_order_implementation``); JAX, OpenMM and POT fix numerics.
dependencies = [
    "beartype==0.22.9",
    "jax==0.10.2",
    "jaxtyping==0.3.11",
    "mdtraj==1.11.1.post1",
    "numpy==2.1.3",
    "openmm==8.5.2",
    "optax==0.2.6",
    "pot==0.9.6.post1",
    "rdkit==2026.3.3",
    "scipy==1.17.1",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.10.2"]
cuda13 = ["jax[cuda13]==0.10.2", "nvidia-cublas==13.6.0.2", "openmm[cuda13]==8.5.2"]
training = ["wandb==0.25.0"]
analysis = ["numpyro==0.21.0", "pymbar==4.0.3"]
dev = ["pytest>=9.0.2,<10", "ruff>=0.15.20,<0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbg = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "equivalence: checks agreement with a reference implementation (pymbar, POT)",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
